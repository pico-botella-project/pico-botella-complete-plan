<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Equipo de desarrollo Dispositivos Moviles - Pico Botella"
    />
    <title>Equipo de Trabajo - Pico Botella</title>
    <link rel="icon" type="image/svg+xml" href="../pico-botella-icon.svg" />
    <link rel="stylesheet" href="../styles/user_stories.css" />
    <link rel="stylesheet" href="../styles/team_members.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header-content">
          <h1 class="logo">
            <span class="logo-icon"></span>
            Equipo de Trabajo
          </h1>
          <div class="project-info">
            <span class="project-name">Pico Botella</span>
          </div>
          <div style="display: flex; gap: 0.5rem; align-items: center">
            <a
              href="../index.html"
              class="back-button"
              aria-label="Volver al inicio"
            >
              <span>&#8592;</span> Inicio
            </a>
            <button
              id="theme-toggle"
              class="theme-toggle"
              aria-label="Cambiar tema"
            >
              <span class="theme-icon">Oscuro</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <!-- Error state -->
        <div id="error-state" class="error-state" hidden role="alert">
          <h2>Error al cargar informacion</h2>
          <p id="error-message"></p>
        </div>

        <!-- Team hero -->
        <div id="team-hero" hidden></div>

        <!-- Members section -->
        <section id="members-section" hidden>
          <h2 class="members-section-title">Integrantes del Equipo</h2>
          <div id="members-grid" class="members-grid"></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>
          &copy; 2026 Pico Botella - Dispositivos Moviles
        </p>
        <p>Desarrollado por Dispositivos Moviles</p>
      </div>
    </footer>

    <script src="../data/team_members_data.js"></script>
    <script src="../scripts/team_members.js"></script>
  </body>
</html>
