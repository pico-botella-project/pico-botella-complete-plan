<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgIA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#bgIA)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.3"/>
  <!-- Body / shoulders -->
