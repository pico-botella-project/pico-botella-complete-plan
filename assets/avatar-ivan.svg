  <ellipse cx="60" cy="43" rx="21" ry="9" fill="#2d1b0e"/>
  <rect x="39" y="43" width="7" height="10" rx="3" fill="#2d1b0e"/>
  <rect x="74" y="43" width="7" height="10" rx="3" fill="#2d1b0e"/>
  <!-- Beard hint -->
  <path d="M44 75 Q60 84 76 75" fill="#2d1b0e" opacity="0.25"/>
