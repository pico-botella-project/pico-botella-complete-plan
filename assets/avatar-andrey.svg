<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgAQ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#bgAQ)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.3"/>
  <!-- Body / shoulders -->
  <ellipse cx="60" cy="97" rx="30" ry="18" fill="#4c1d95"/>
  <!-- Neck -->
  <rect x="54" y="73" width="12" height="12" rx="4" fill="#d4a574"/>
  <!-- Head -->
  <ellipse cx="60" cy="62" rx="21" ry="23" fill="#d4a574"/>
  <!-- Hair - medium length, dark brown -->
  <ellipse cx="60" cy="43" rx="21" ry="10" fill="#1c0a00"/>
  <rect x="39" y="43" width="8" height="18" rx="4" fill="#1c0a00"/>
  <rect x="73" y="43" width="8" height="18" rx="4" fill="#1c0a00"/>
  <!-- Eyes -->
  <ellipse cx="52" cy="63" rx="3.8" ry="3.5" fill="#fff"/>
  <circle cx="52" cy="63" r="2.2" fill="#1c0a00"/>
  <ellipse cx="68" cy="63" rx="3.8" ry="3.5" fill="#fff"/>
  <circle cx="68" cy="63" r="2.2" fill="#1c0a00"/>
  <!-- Eyebrows slightly arched -->
  <path d="M47 56 Q52 53 57 56" stroke="#1c0a00" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M63 56 Q68 53 73 56" stroke="#1c0a00" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M59 68 Q58 73 62 73" stroke="#b8866e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Mouth - friendly smile -->
  <path d="M52 78 Q60 84 68 78" stroke="#b8866e" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Shirt / collar -->
  <path d="M44 92 L50 82 L60 86 L70 82 L76 92" fill="#7c3aed" stroke="none"/>
  <!-- Design tool icon (pencil) on shirt area hint -->
  <!-- Initials badge -->
  <circle cx="95" cy="25" r="14" fill="#8b5cf6" stroke="#fff" stroke-width="2"/>
  <text x="95" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff">AQ</text>
</svg>
